; Yachachiq analysis box controller - PlatformIO project.
; Build:  pio run            Flash:  pio run -t upload      Monitor: pio device monitor
; Versions are pinned so the firmware builds the same way in November.
;  - platformio/espressif32 6.13.0 ships Arduino-ESP32 2.0.17 (ESP-IDF 4.4.7).
;  - FastAccelStepper 1.3.4 supports ESP-IDF 4 (MCPWM/PCNT driver) on the ESP32.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = platformio/espressif32 @ 6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = direct
build_flags =
  -Wall
  -DCORE_DEBUG_LEVEL=0
  ; GPIO interrupt service in IRAM: the door interlock ISR keeps working while
  ; the flash cache is off (NVS writes of calibration/config)
  -DCONFIG_ARDUINO_ISR_IRAM=1
lib_deps =
  gin66/FastAccelStepper @ 1.3.4
  teemuatlut/TMCStepper @ 0.7.3
  bblanchon/ArduinoJson @ 7.4.3
  bogde/HX711 @ 0.7.5

; Emulator-only build for Espressif QEMU (tools/box_qemu.py): same firmware
; without the stepper pulse engine (QEMU has no MCPWM/PCNT). Never flash it.
[env:qemu]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -DYQ_NO_STEPPER
